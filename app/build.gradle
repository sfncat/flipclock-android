def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    defaultConfig {
        compileSdk 33
        if (buildAsApplication) {
            applicationId "com.stackof.flipclockv2"
        }
        // minSdk 21 required by NDK r28 (16 KB page size support).
        minSdkVersion 21
        targetSdkVersion 33
        versionCode project.hasProperty('APP_VERSION_CODE') ? project.property('APP_VERSION_CODE').toInteger() : 200
        versionName project.hasProperty('APP_VERSION_NAME') ? project.property('APP_VERSION_NAME') : "2.0.0"
        // NDK r28+ aligns 64-bit libraries to 16 KB by default, which is
        // required for Android 15+ devices with 16 KB memory page sizes.
        ndkVersion "28.2.13676358"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
            // cmake {
            //     arguments "-DANDROID_APP_PLATFORM=android-16", "-DANDROID_STL=c++_static"
            //     // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            //     abiFilters 'arm64-v8a'
            // }
        }
    }
    // 签名配置：从 keystore/keystore.properties 读取（该文件不入库，见 .gitignore）。
    // 首次使用请复制 keystore/keystore.properties.template 为 keystore.properties 并填写密码。
    signingConfigs {
        release {
            def propsFile = rootProject.file('keystore/keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile file(props['storeFile'] ?: '../keystore/flipclockV2new.keystore')
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            } else {
                println "WARNING: keystore/keystore.properties not found, release APK will be unsigned."
            }
        }
    }
    buildTypes {
        release {
            // It seems enable minify and shrink resources will make SDL2 crash.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
            // cmake {
            //     path 'jni/CMakeLists.txt'
            // }
        }
       
    }
    lintOptions {
        abortOnError false
    }
    namespace 'com.stackof.flipclockv2'

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "com.stackof.flipclockv2.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':weather')
}
